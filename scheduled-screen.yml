name: Scheduled Screen

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check schedule gate
        id: gate
        run: |
          ENABLED="${{ vars.SCREEN_ENABLED }}"
          ENABLED_NORM=$(echo "$ENABLED" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          TARGET="${{ vars.SCREEN_TIME }}"
          MANUAL="${{ github.event_name }}"

          if [ "$MANUAL" = "workflow_dispatch" ]; then
            echo "手動実行のため時刻チェックをスキップします"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ENABLED_NORM" != "ON" ]; then
            echo "SCREEN_ENABLED が ON ではないためスキップします (現在値: '$ENABLED')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$TARGET" ]; then
            TARGET="09:00"
          fi

          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          LAST_RUN=""
          if [ -f data/last-run.txt ]; then
            LAST_RUN=$(cat data/last-run.txt)
          fi
          if [ "$LAST_RUN" = "$TODAY" ]; then
            echo "本日は実行済みのためスキップします (last-run.txt: $LAST_RUN)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(TZ=Asia/Tokyo date +%H:%M)
          NOW_MIN=$((10#${NOW%%:*} * 60 + 10#${NOW##*:}))
          TARGET_MIN=$((10#${TARGET%%:*} * 60 + 10#${TARGET##*:}))
          DIFF=$((NOW_MIN - TARGET_MIN))

          echo "判定情報: NOW=$NOW TARGET=$TARGET DIFF=${DIFF}分 LAST_RUN=$LAST_RUN TODAY=$TODAY"

          if [ $DIFF -ge 0 ] && [ $DIFF -lt 90 ]; then
            echo "実行時刻です (現在 $NOW / 設定 $TARGET)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "時刻ウィンドウ外のためスキップします (現在 $NOW / 設定 $TARGET / 差分 ${DIFF}分)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run screening script
        if: steps.gate.outputs.skip == 'false'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          MAX_COUNT: ${{ vars.MAX_COUNT }}
          MIN_VOLUME: ${{ vars.MIN_VOLUME }}
          BULK_WINDOW_DAYS: ${{ vars.BULK_WINDOW_DAYS }}
        run: node scripts/screen.js

      - name: Record last run date
        if: steps.gate.outputs.skip == 'false'
        run: |
          mkdir -p data
          TZ=Asia/Tokyo date +%Y-%m-%d > data/last-run.txt

      - name: Commit results
        if: steps.gate.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/last-run.txt data/run-log.txt
          git commit -m "決算ピックアップ自動取得 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')" || echo "変更なし"
          git push

      - name: Create notification issue
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="決算ピックアップ完了 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          gh issue create --title "$TITLE" --body-file "data/issue-body.txt"
